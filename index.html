<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Point Allocation</title>
<style>
:root{
  --bg:#17171a; --panel:#232328; --panel2:#2d2d33; --line:#4a4a52;
  --text:#ececec; --muted:#b4b4bc; --accent:#d8d8de;
  --gA:#d0d0d0; --gB:#8c8c8c;            /* neutral Matrix A / B */
  --purple:#6a3fc4; --purple-text:#f1f1f1; --purple-chart:#9d7bea;
  --green:#8fdc94;  --green-text:#10210f;  --green-chart:#8fdc94;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 120px}
.btn{display:block;width:100%;min-height:56px;padding:14px 18px;border-radius:12px;border:2px solid var(--accent);
  background:var(--accent);color:#111;font-weight:700;font-size:1.1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text)}
.block{border-radius:18px;padding:40px 20px;text-align:center;margin:20px 0;border:3px solid var(--text)}
.block .big{font-size:2.6rem;font-weight:800;letter-spacing:.02em}
.block.purple{background:var(--purple);color:var(--purple-text)}
.block.green{background:var(--green);color:var(--green-text)}
.sub{color:var(--muted)}
.hdr{position:sticky;top:0;background:var(--bg);padding:10px 0 8px;z-index:2;border-bottom:2px solid var(--line)}
.hdr .row,.card .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{background:var(--panel);border-radius:10px;padding:8px 6px;text-align:center;font-weight:700}
.who small{display:block;font-weight:500;color:var(--muted)}
.who .tag{display:inline-block;margin-top:2px;padding:0 8px;border-radius:6px;font-size:.8rem;font-weight:700}
.tag.purple{background:var(--purple);color:var(--purple-text)}
.tag.green{background:var(--green);color:var(--green-text)}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.card{min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--panel);padding:8px;width:100%;text-align:center}
.card .pts{font-size:1.7rem;font-weight:800;padding:6px 0}
.card[aria-checked=true]{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 3px var(--accent)}
.card[aria-checked=true] .pts::after{content:""}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .inner{max-width:480px;margin:0 auto}
.msg{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.err{border-color:var(--accent)}
ul.plain{padding-left:1.1em}ul.plain li{margin:.6em 0}

/* ---------------- instructor ---------------- */
body.inst{font-size:22px}
.top{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:16px 24px;border-bottom:2px solid var(--line)}
.top .n{font-size:4rem;font-weight:800;line-height:1}
.top .n small{display:block;font-size:1rem;color:var(--muted);font-weight:500}
.top .url{font-size:1.4rem;font-weight:700;word-break:break-all}
.top .grow{flex:1;min-width:240px}
#qr{background:#ececec;padding:8px;border-radius:8px;line-height:0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;padding:12px 24px}
.ctl button{width:auto;min-height:48px;padding:8px 18px;font-size:1.05rem}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-right:6px}
.dot.bad{background:transparent;border:2px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:16px;padding:0 24px 40px}
.panel{background:var(--panel);border-radius:14px;padding:14px 16px}
.panel h2{font-size:1.15rem;margin:0 0 6px}
.panel.wide{grid-column:1/-1}
.panel svg{width:100%;height:auto;display:block}
svg text{fill:var(--text);font-family:inherit}
svg .ax{stroke:var(--line);stroke-width:1}
svg .muted{fill:var(--muted)}
.hidden{display:none!important}
.hiddenmsg{padding:80px 24px;text-align:center;font-size:2rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:var(--panel2);border-radius:10px;padding:8px}
.stats b{display:block;font-size:2rem}
.stats span{color:var(--muted);font-size:.9rem}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script id="core">
/*CORE:START*/
const CONFIG = {
  SUPABASE_URL: 'https://YOUR-PROJECT.supabase.co',
  SUPABASE_ANON_KEY: 'YOUR-ANON-KEY',
  POLL_MS: 2000,
  groups: {   // keys must match the check constraint in schema.sql
    purple: {name: 'Purple'},
    green:  {name: 'Green'},
  },
  colorProbability: 0.5,          // P(purple)
  columns: 13,
  fairColumn: 7,                  // lean = fairColumn - c
  // points = base + slope * c
  matrices: {
    A: {label: 'Matrix A (costly)', ingroup: [6, 1],  outgroup: [-1, 2]},
    B: {label: 'Matrix B (free)',   ingroup: [20, -1], outgroup: [6, 1]},
  },
};

function pointsFor(key, c) {
  const m = CONFIG.matrices[key];
  return {ingroup: m.ingroup[0] + m.ingroup[1] * c, outgroup: m.outgroup[0] + m.outgroup[1] * c};
}
function leanOf(c) { return CONFIG.fairColumn - c; }

// Displayed position (0-based, top to bottom) -> canonical column c (1..13).
function canonicalColumn(direction, pos) {
  if (!Number.isInteger(pos) || pos < 0 || pos >= CONFIG.columns) throw new RangeError('bad position ' + pos);
  if (direction === 'asc') return pos + 1;
  if (direction === 'desc') return CONFIG.columns - pos;
  throw new Error('bad direction ' + direction);
}

// Everything the UI needs to draw one card, derived from canonicalColumn only.
function cardModel(key, direction, rowOrder, pos) {
  const c = canonicalColumn(direction, pos);
  const p = pointsFor(key, c);
  const ing = {who: 'ingroup', pts: p.ingroup}, out = {who: 'outgroup', pts: p.outgroup};
  return {c, cells: rowOrder === 'ingroup_first' ? [ing, out] : [out, ing]};
}

function randomize(rng) {
  rng = rng || Math.random;
  const pick = (a, b) => (rng() < 0.5 ? a : b);
  const digit = () => 10 + Math.floor(rng() * 90);
  const ci = digit(); let co = digit(); while (co === ci) co = digit();
  return {
    color: rng() < CONFIG.colorProbability ? 'purple' : 'green',
    matrix_order: pick('AB', 'BA'),
    a_row_order: pick('ingroup_first', 'outgroup_first'),
    b_row_order: pick('ingroup_first', 'outgroup_first'),
    a_direction: pick('asc', 'desc'),
    b_direction: pick('asc', 'desc'),
    codes: {ingroup: ci, outgroup: co},
  };
}

// ---- statistics ----
const T975 = [12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,
  2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045,2.042];
function tCrit(df) {   // two-sided 95%
  if (df < 1) return NaN;
  if (df <= 30) return T975[df - 1];
  const z = 1.959964;  // Cornish-Fisher expansion
  return z + (z**3 + z) / (4 * df) + (5 * z**5 + 16 * z**3 + 3 * z) / (96 * df * df);
}
function summarize(xs) {
  const n = xs.length;
  if (!n) return {n: 0, mean: NaN, sd: NaN, lo: NaN, hi: NaN};
  const mean = xs.reduce((s, x) => s + x, 0) / n;
  if (n < 2) return {n, mean, sd: NaN, lo: NaN, hi: NaN};
  const sd = Math.sqrt(xs.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1));
  const h = tCrit(n - 1) * sd / Math.sqrt(n);
  return {n, mean, sd, lo: mean - h, hi: mean + h};
}
function histogram(vals) {  // lean -6..+6
  const L = CONFIG.fairColumn - 1, out = {};
  for (let k = -L; k <= L; k++) out[k] = 0;
  vals.forEach(v => { out[v]++; });
  return out;
}
function bubbles(rows) {
  const m = new Map();
  rows.forEach(r => { const k = r.a_lean + ',' + r.b_lean; m.set(k, (m.get(k) || 0) + 1); });
  return [...m].map(([k, count]) => { const [a, b] = k.split(',').map(Number); return {a, b, count}; });
}
function analyze(rows) {
  const A = rows.map(r => r.a_lean), B = rows.map(r => r.b_lean);
  const by = (f) => (v) => rows.filter(r => f(r) === v);
  const avg = r => (r.a_lean + r.b_lean) / 2;
  return {
    n: rows.length,
    histA: histogram(A), histB: histogram(B),
    A: summarize(A), B: summarize(B),
    diff: summarize(rows.map(r => r.b_lean - r.a_lean)),
    bubbles: bubbles(rows),
    byColor: Object.fromEntries(Object.keys(CONFIG.groups).map(c => [c, summarize(by(r => r.color)(c).map(avg))])),
    byOrder: Object.fromEntries(['AB', 'BA'].map(o => {
      const g = by(r => r.matrix_order)(o);
      return [o, {A: summarize(g.map(r => r.a_lean)), B: summarize(g.map(r => r.b_lean))}];
    })),
  };
}
/*CORE:END*/
</script>

<script>
(function () {
'use strict';
const $app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const INSTRUCTOR_KEY = params.get('instructor');

// ---------- tiny helpers ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(x => e.append(x instanceof Node ? x : document.createTextNode(String(x))));
  return e;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const gname = k => CONFIG.groups[k].name;
const configured = !/YOUR-/.test(CONFIG.SUPABASE_URL + CONFIG.SUPABASE_ANON_KEY);
function client() {
  if (!configured) throw new Error('Supabase is not configured in CONFIG.');
  if (!window.supabase) throw new Error('Could not load the Supabase library.');
  return window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
    {auth: {persistSession: false, autoRefreshToken: false}});
}

// localStorage with in-memory fallback
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v == null ? mem[k] ?? null : v; } catch (e) { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} },
};

// =====================================================================
//                              STUDENT
// =====================================================================
const KEY = 'mgp_state_v1';
function newToken() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Array.from({length: 4}, () => Math.random().toString(36).slice(2, 10)).join('');
}
function loadState() {
  if (params.get('fresh')) store.del(KEY);
  try { const s = JSON.parse(store.get(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  const s = Object.assign({v: 1, token: newToken(), stage: 'landing', answers: {A: null, B: null}, submitted: false}, randomize());
  store.set(KEY, JSON.stringify(s));
  return s;
}

function student() {
  const S = loadState();
  const save = () => store.set(KEY, JSON.stringify(S));
  const go = stage => { S.stage = stage; save(); render(); };
  const seq = S.matrix_order.split('');   // e.g. ['B','A']
  let sb = null, selected = null, sendState = {busy: false, error: null};

  function groupBlock() {
    return h('div', {class: 'block ' + S.color},
      h('div', {class: 'sub', style: 'color:inherit'}, 'You are in the'),
      h('div', {class: 'big'}, gname(S.color).toUpperCase()),
      h('div', {style: 'font-size:1.3rem;font-weight:700'}, 'group'));
  }

  function landing() {
    return h('div', {class: 'wrap'},
      h('h1', {}, 'Welcome'),
      h('p', {}, 'You are in the ', h('b', {}, gname(S.color)), ' group. Groups were assigned randomly.'),
      groupBlock(),
      h('button', {class: 'btn', onclick: () => go('instructions')}, 'Start'));
  }

  function instructions() {
    return h('div', {class: 'wrap'},
      h('h1', {}, 'Instructions'),
      h('ul', {class: 'plain'},
        h('li', {}, 'You will divide points between two people you will never meet. You get no points yourself. The two people are identified only by a code number and a group.'),
        h('li', {}, 'There are no right answers.'),
        h('li', {}, 'You will do this twice. Tap one option, then tap Confirm. You cannot change an answer after confirming.')),
      h('p', {class: 'sub'}, 'You are in the ' + gname(S.color) + ' group.'),
      h('button', {class: 'btn', onclick: () => go('m1')}, 'Continue'));
  }

  function matrixScreen(idx) {
    const key = seq[idx], lk = key.toLowerCase();
    const dir = S[lk + '_direction'], ro = S[lk + '_row_order'];
    const other = S.color === 'purple' ? 'green' : 'purple';
    const who = {
      ingroup: h('div', {class: 'who'}, 'Person #' + S.codes.ingroup + ' (your group)', h('small', {}, ''),
        h('span', {class: 'tag ' + S.color}, gname(S.color))),
      outgroup: h('div', {class: 'who'}, 'Person #' + S.codes.outgroup + ' (other group)', h('small', {}, ''),
        h('span', {class: 'tag ' + other}, gname(other))),
    };
    const order = ro === 'ingroup_first' ? ['ingroup', 'outgroup'] : ['outgroup', 'ingroup'];
    const confirm = h('button', {class: 'btn', disabled: true}, 'Confirm');
    const cards = [];
    for (let pos = 0; pos < CONFIG.columns; pos++) {
      const m = cardModel(key, dir, ro, pos);
      const el = h('button', {class: 'card', role: 'radio', 'aria-checked': 'false', 'data-pos': pos},
        h('div', {class: 'row'}, m.cells.map(c => h('div', {class: 'pts'}, c.pts))));
      el.addEventListener('click', () => {
        selected = pos;
        cards.forEach(c => c.setAttribute('aria-checked', String(c === el)));
        confirm.disabled = false;
      });
      cards.push(el);
    }
    confirm.addEventListener('click', () => {
      if (selected == null) return;
      S.answers[key] = canonicalColumn(dir, selected);   // always store canonical c
      selected = null;
      if (idx === 0) go('m2'); else { S.stage = 'sending'; save(); render(); doSubmit(); }
    });
    return h('div', {class: 'wrap'},
      h('div', {class: 'hdr'},
        h('div', {class: 'sub', style: 'margin-bottom:6px'}, 'Part ' + (idx + 1) + ' of 2: choose one option'),
        h('div', {class: 'row'}, order.map(k => who[k]))),
      h('div', {class: 'cards', role: 'radiogroup'}, cards),
      h('div', {class: 'bar'}, h('div', {class: 'inner'}, confirm)));
  }

  function sending() {
    return h('div', {class: 'wrap'},
      h('h1', {}, sendState.error ? 'Not sent yet' : 'Sending…'),
      sendState.error ? h('div', {class: 'msg err'}, sendState.error) : h('p', {class: 'sub'}, 'Please wait.'),
      sendState.error ? h('button', {class: 'btn', onclick: () => doSubmit()}, 'Try again') : '');
  }

  function done() {
    return h('div', {class: 'wrap'}, h('h1', {}, 'Thanks.'), h('p', {style: 'font-size:1.4rem'}, 'Watch the screen.'),
      h('p', {class: 'sub'}, 'You are in the ' + gname(S.color) + ' group.'));
  }

  async function doSubmit() {
    if (sendState.busy) return;
    sendState = {busy: true, error: null}; render();
    const row = {
      token: S.token, color: S.color, matrix_order: S.matrix_order,
      a_row_order: S.a_row_order, a_direction: S.a_direction,
      b_row_order: S.b_row_order, b_direction: S.b_direction,
      a_col: S.answers.A, b_col: S.answers.B,
    };
    let lastErr = null;
    for (let attempt = 0; attempt < 4; attempt++) {          // 1 try + 3 automatic retries
      if (attempt) await sleep(1500 * 2 ** (attempt - 1));
      try {
        sb = sb || client();
        const {error} = await sb.from('submissions').upsert(row, {onConflict: 'token', ignoreDuplicates: true});
        if (!error) { S.submitted = true; sendState = {busy: false, error: null}; go('done'); return; }
        lastErr = error;
        if (error.code === '42501') break;                    // closed or rejected: retrying won't help
      } catch (e) { lastErr = e; }
    }
    const closed = lastErr && (lastErr.code === '42501' || /row-level security/i.test(lastErr.message || ''));
    sendState = {busy: false, error: closed ? 'Submissions are closed.' : 'We could not send your answers. Check your connection and tap Try again. Your answers are saved on this phone.'};
    render();
  }

  function render() {
    // keep answers across reloads; resume at the right step
    if (S.submitted) S.stage = 'done';
    const views = {
      landing, instructions,
      m1: () => matrixScreen(0), m2: () => matrixScreen(1),
      sending, done,
    };
    $app.replaceChildren(views[S.stage]());
    window.scrollTo(0, 0);
  }

  if (!configured) {
    $app.append(h('div', {class: 'wrap'}, h('div', {class: 'msg'}, 'This page is not configured yet (Supabase URL and key missing).')));
    return;
  }
  render();
  if (S.stage === 'sending') doSubmit();   // resume a pending send after reload
}

// =====================================================================
//                            INSTRUCTOR
// =====================================================================
const NS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
// Tween numeric attributes so updates fill in gently.
function animateTo(el, target, ms = 500) {
  if (el._raf) cancelAnimationFrame(el._raf);
  const from = {};
  for (const k of Object.keys(target)) from[k] = parseFloat(el.getAttribute(k));
  if (Object.values(from).some(isNaN)) { for (const k in target) el.setAttribute(k, target[k]); return; }
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - (1 - t) ** 3;
    for (const k in target) el.setAttribute(k, from[k] + (target[k] - from[k]) * e);
    el._raf = t < 1 ? requestAnimationFrame(step) : null;
  };
  el._raf = requestAnimationFrame(step);
}
const fmt = (x, d = 2) => (Number.isFinite(x) ? (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d) : '–');

function instructor() {
  let sb;
  try { sb = client(); } catch (e) { $app.append(h('div', {class: 'wrap'}, h('div', {class: 'msg'}, e.message))); return; }
  document.body.classList.add('inst');

  const studentUrl = location.origin + location.pathname;
  const nEl = h('div', {class: 'n'}, '0', h('small', {}, 'submissions'));
  const conn = h('span', {}, h('span', {class: 'dot bad'}), 'connecting');
  const qr = h('div', {id: 'qr'});
  const btnReveal = h('button', {class: 'btn'}, 'Reveal results');
  const btnClose = h('button', {class: 'btn ghost'}, 'Close submissions');
  const btnReset = h('button', {class: 'btn ghost'}, 'Reset data');
  const hiddenMsg = h('div', {class: 'hiddenmsg'}, 'Results are hidden.');
  const charts = h('div', {class: 'grid hidden'});
  $app.append(
    h('div', {class: 'top'}, nEl,
      h('div', {class: 'grow'}, h('div', {class: 'sub'}, 'Join on your phone:'), h('div', {class: 'url'}, studentUrl.replace(/^https?:\/\//, '')),
        h('div', {class: 'sub', style: 'font-size:1rem;margin-top:6px'}, conn)),
      qr),
    h('div', {class: 'ctl'}, btnReveal, btnClose, btnReset), hiddenMsg, charts);
  try { new QRCode(qr, {text: studentUrl, width: 170, height: 170, colorDark: '#111111', colorLight: '#ececec', correctLevel: QRCode.CorrectLevel.M}); }
  catch (e) { qr.remove(); }

  // ----- chart scaffolding -----
  function panel(title, cls) { const svg = s('svg'); return {svg, el: h('div', {class: 'panel ' + (cls || '')}, h('h2', {}, title), svg)}; }
  const pHA = panel('Matrix A (costly): lean'), pHB = panel('Matrix B (free): lean');
  const pStat = h('div', {class: 'panel'}, h('h2', {}, 'Mean lean and paired difference'));
  const stats = h('div', {class: 'stats'}); const ciSvg = s('svg'); pStat.append(stats, ciSvg);
  const pSc = panel('Each dot: one student (size = how many)'), pCol = panel('Mean lean by group (A and B averaged)'),
        pOrd = panel('Order check: mean lean by matrix order');
  charts.append(pHA.el, pHB.el, pStat, pSc.el, pCol.el, pOrd.el);
  pHA.el.append(h('div', {class: 'sub', style: 'font-size:.9rem'}, 'Lean: + favors own group, 0 = fair, − favors other group.'));

  // ----- histogram -----
  function drawHist(p, hist, color, ymax) {
    const svg = p.svg, W = 600, H = 340, m = {l: 44, r: 12, t: 12, b: 50};
    if (!svg._init) {
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg._init = true; svg._bars = {};
      const bw = (W - m.l - m.r) / 13;
      svg.append(s('line', {class: 'ax', x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b}));
      for (let k = -6; k <= 6; k++) {
        const x = m.l + (k + 6) * bw;
        const r = s('rect', {x: x + 3, width: bw - 6, y: H - m.b, height: 0, fill: color, rx: 2}); svg.append(r); svg._bars[k] = r;
        svg.append(s('text', {x: x + bw / 2, y: H - m.b + 24, 'text-anchor': 'middle', 'font-size': 18}, k > 0 ? '+' + k : k));
      }
      const zx = m.l + 6.5 * bw;
      svg.append(s('line', {x1: zx, x2: zx, y1: m.t, y2: H - m.b + 6, stroke: '#ececec', 'stroke-width': 2, 'stroke-dasharray': '6 5'}));
      svg.append(s('text', {x: zx + 6, y: m.t + 16, 'font-size': 16, class: 'muted'}, '0 = fair'));
      svg.append(s('text', {x: (m.l + W - m.r) / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 16, class: 'muted'}, '← favors other group      favors own group →'));
      svg._ymax = s('text', {x: m.l - 6, y: m.t + 14, 'text-anchor': 'end', 'font-size': 16, class: 'muted'}, '');
      svg.append(svg._ymax);
    }
    svg._ymax.textContent = ymax;
    for (let k = -6; k <= 6; k++) {
      const hh = (hist[k] / ymax) * (H - m.b - m.t - 24);
      animateTo(svg._bars[k], {height: hh, y: H - m.b - hh});
    }
  }

  // ----- horizontal mean bars with 95% CI -----
  function drawMeans(p, items, minRange) {
    const svg = p.svg, W = 600, rowH = 62, H = items.length * rowH + 50, m = {l: 130, r: 90, t: 8};
    const D = Math.max(minRange || 2, Math.ceil(Math.max(0, ...items.map(i => Math.max(Math.abs(i.mean) || 0, Math.abs(i.lo) || 0, Math.abs(i.hi) || 0)))));
    const x = v => m.l + (v + D) / (2 * D) * (W - m.l - m.r);
    const sig = items.map(i => i.key).join('|') + '|' + D;
    if (svg._sig !== sig) {
      svg._sig = sig; svg.replaceChildren(); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg._rows = {};
      for (let v = -D; v <= D; v++) svg.append(s('text', {x: x(v), y: H - 10, 'text-anchor': 'middle', 'font-size': 16, class: 'muted'}, v > 0 ? '+' + v : v));
      svg.append(s('line', {x1: x(0), x2: x(0), y1: m.t, y2: H - 30, stroke: '#ececec', 'stroke-width': 2, 'stroke-dasharray': '6 5'}));
      items.forEach((it, i) => {
        const y = m.t + i * rowH;
        const bar = s('rect', {x: x(0), width: 0, y: y + 8, height: 28, fill: it.fill, rx: 3});
        const ci = s('line', {x1: x(0), x2: x(0), y1: y + 22, y2: y + 22, stroke: '#ececec', 'stroke-width': 3});
        const t1 = s('text', {x: m.l - 10, y: y + 29, 'text-anchor': 'end', 'font-size': 20, 'font-weight': 700}, it.label);
        const t2 = s('text', {x: m.l - 10, y: y + 50, 'text-anchor': 'end', 'font-size': 14, class: 'muted'}, '');
        const t3 = s('text', {x: W - m.r + 8, y: y + 29, 'font-size': 20, 'font-weight': 700}, '');
        svg.append(bar, ci, t1, t2, t3); svg._rows[it.key] = {bar, ci, t2, t3};
      });
    }
    items.forEach(it => {
      const r = svg._rows[it.key];
      r.t2.textContent = 'n = ' + it.n; r.t3.textContent = fmt(it.mean);
      if (!Number.isFinite(it.mean)) { animateTo(r.bar, {width: 0}); return; }
      const x0 = x(0), xm = x(it.mean);
      animateTo(r.bar, {x: Math.min(x0, xm), width: Math.abs(xm - x0)});
      const lo = Number.isFinite(it.lo) ? x(it.lo) : xm, hi = Number.isFinite(it.hi) ? x(it.hi) : xm;
      animateTo(r.ci, {x1: lo, x2: hi});
    });
  }

  // ----- scatter -----
  function drawScatter(list) {
    const svg = pSc.svg, W = 600, H = 600, m = 50, step = (W - 2 * m) / 12;
    const px = v => m + (v + 6) * step, py = v => H - m - (v + 6) * step;
    if (!svg._init) {
      svg._init = true; svg._pts = {}; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      for (let v = -6; v <= 6; v += 2) {
        svg.append(s('text', {x: px(v), y: H - m + 26, 'text-anchor': 'middle', 'font-size': 16, class: 'muted'}, v > 0 ? '+' + v : v));
        svg.append(s('text', {x: m - 10, y: py(v) + 5, 'text-anchor': 'end', 'font-size': 16, class: 'muted'}, v > 0 ? '+' + v : v));
      }
      svg.append(s('rect', {x: m, y: m, width: W - 2 * m, height: H - 2 * m, fill: 'none', class: 'ax'}));
      svg.append(s('line', {x1: px(0), x2: px(0), y1: m, y2: H - m, stroke: '#ececec', 'stroke-width': 2, 'stroke-dasharray': '6 5'}));
      svg.append(s('line', {x1: m, x2: W - m, y1: py(0), y2: py(0), stroke: '#ececec', 'stroke-width': 2, 'stroke-dasharray': '6 5'}));
      svg.append(s('text', {x: W / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 18}, 'Matrix A lean (costly)'));
      svg.append(s('text', {x: 16, y: H / 2, 'text-anchor': 'middle', 'font-size': 18, transform: `rotate(-90 16 ${H / 2})`}, 'Matrix B lean (free)'));
    }
    const seen = new Set(), R = 9;
    list.forEach(b => {
      const k = b.a + ',' + b.b; seen.add(k);
      let c = svg._pts[k];
      if (!c) { c = s('circle', {cx: px(b.a), cy: py(b.b), r: 0, fill: '#bdbdbd', 'fill-opacity': .7, stroke: '#ececec', 'stroke-width': 1.5}); svg.append(c); svg._pts[k] = c; }
      animateTo(c, {r: R * Math.sqrt(b.count)});
    });
    Object.keys(svg._pts).forEach(k => { if (!seen.has(k)) animateTo(svg._pts[k], {r: 0}); });
  }

  // ----- stats tiles + difference CI -----
  function drawStats(a) {
    stats.replaceChildren(
      h('div', {}, h('b', {}, fmt(a.A.mean)), h('span', {}, 'mean lean, Matrix A')),
      h('div', {}, h('b', {}, fmt(a.B.mean)), h('span', {}, 'mean lean, Matrix B')),
      h('div', {}, h('b', {}, fmt(a.diff.mean)), h('span', {}, Number.isFinite(a.diff.lo)
        ? `B − A, 95% CI [${fmt(a.diff.lo)}, ${fmt(a.diff.hi)}]` : 'B − A (need n ≥ 2 for CI)')));
    drawMeans({svg: ciSvg}, [{key: 'd', label: 'B − A', n: a.diff.n, mean: a.diff.mean, lo: a.diff.lo, hi: a.diff.hi, fill: '#8c8c8c'}], 2);
  }

  function update(rows) {
    const a = analyze(rows);
    nEl.firstChild.textContent = a.n;
    if (!revealed) return;
    const ymax = Math.max(5, ...Object.values(a.histA), ...Object.values(a.histB));
    drawHist(pHA, a.histA, '#d0d0d0', ymax); drawHist(pHB, a.histB, '#8c8c8c', ymax);
    drawStats(a);
    drawScatter(a.bubbles);
    drawMeans(pCol, Object.keys(CONFIG.groups).map(k => Object.assign(
      {key: k, label: gname(k), fill: k === 'purple' ? '#9d7bea' : '#8fdc94'}, a.byColor[k])), 2);
    drawMeans(pOrd, ['AB', 'BA'].flatMap(o => ['A', 'B'].map(k => Object.assign(
      {key: o + k, label: `${o}: Matrix ${k}`, fill: k === 'A' ? '#d0d0d0' : '#8c8c8c'}, a.byOrder[o][k]))), 2);
  }

  // ----- state, polling, controls -----
  let revealed = false, rows = [], open = true;
  function setReveal(v) {
    revealed = v; btnReveal.textContent = v ? 'Hide results' : 'Reveal results';
    charts.classList.toggle('hidden', !v); hiddenMsg.classList.toggle('hidden', v);
    update(rows);
  }
  const setOpenLabel = () => { btnClose.textContent = open ? 'Close submissions' : 'Reopen submissions'; };
  btnReveal.addEventListener('click', () => setReveal(!revealed));
  btnClose.addEventListener('click', async () => {
    const {error} = await sb.rpc('set_submissions_open', {p_key: INSTRUCTOR_KEY, p_open: !open});
    if (!error) { open = !open; setOpenLabel(); } else alert(error.message);
  });
  btnReset.addEventListener('click', async () => {
    if (!confirm('Delete ALL submissions? This cannot be undone.')) return;
    const {error} = await sb.rpc('reset_data', {p_key: INSTRUCTOR_KEY});
    if (error) alert(error.message); else poll();
  });

  let polling = false;
  async function poll() {
    if (polling) return; polling = true;
    try {
      const [r, st] = await Promise.all([sb.rpc('instructor_results', {p_key: INSTRUCTOR_KEY}), sb.rpc('instructor_status', {p_key: INSTRUCTOR_KEY})]);
      if (r.error) throw r.error;
      rows = r.data || []; if (!st.error) { open = st.data; setOpenLabel(); }
      conn.replaceChildren(h('span', {class: 'dot'}), 'live');
      update(rows);
    } catch (e) {
      conn.replaceChildren(h('span', {class: 'dot bad'}), /invalid instructor key/.test(e.message || '') ? 'invalid instructor key' : 'connection problem, retrying');
    } finally { polling = false; }
  }
  setReveal(false); poll(); setInterval(poll, CONFIG.POLL_MS);
}

if (INSTRUCTOR_KEY) instructor(); else student();
})();
</script>
